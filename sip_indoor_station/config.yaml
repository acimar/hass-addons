name: SIP Indoor Station (Opus fork)
slug: sip_indoor_station
description: SIP/WebRTC bridge for door stations — fork with configurable audio codec (Opus wideband)
url: https://github.com/acimar/hass-addons/tree/feat/audio-codec/sip_indoor_station
version: 0.2.7
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: false
ingress: true
ingress_port: 8080
ports:
  5060/udp: 5060
  40000/udp: 40000
  8556/udp: 8556
ports_description:
  5060/udp: SIP UDP listener
  40000/udp: RTP media port advertised to the door station
  8556/udp: WebRTC ICE UDP media port
options:
  local_address: ""
  sip_username: door
  sip_password: door
  sip_realm: sip.local
  webrtc_ice_candidates: ""
  webrtc_stun_servers: ""
  webrtc_turn_servers: ""
  webrtc_turn_username: ""
  webrtc_turn_password: ""
  webrtc_ice_transport_policy: all
  call_history_enabled: true
  call_history_days: 30
  door_station_vendor: ""
  audio_codec_preference: "PCMA,PCMU"
  audio_type: voice
  audio_packet_loss_percentage: 15
  rtp_jitter_buffer_ms: 60
  rtp_clock_fix: "off"
  relays_count: 1
  api_enabled: false
  api_host: ""
  api_username: ""
  api_password: ""
schema:
  local_address: str
  sip_username: str
  sip_password: password
  sip_realm: str
  webrtc_ice_candidates: str
  webrtc_stun_servers: str
  webrtc_turn_servers: str
  webrtc_turn_username: str
  webrtc_turn_password: password
  webrtc_ice_transport_policy: list(all|relay)
  call_history_enabled: bool
  call_history_days: int
  door_station_vendor: list(|hikvision|dahua|dnake)
  audio_codec_preference: str
  audio_type: list(voice|generic)
  audio_packet_loss_percentage: int(0,100)
  rtp_jitter_buffer_ms: int(0,1000)
  rtp_clock_fix: list(off|ts6|capssetter|jbnone)
  relays_count: int
  api_enabled: bool
  api_host: str
  api_username: str
  api_password: password
